<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>One Sky — a shared shooting star tracker for the Maritimes</title>
<meta name="description" content="When someone in the Maritimes sees a shooting star and taps the button, it flies for everyone watching. A live shared night sky over Cape Breton.">
<meta property="og:title" content="One Sky — a shared shooting star tracker">
<meta property="og:description" content="Report a shooting star and it flies for everyone watching. One sky, the whole Maritimes under it.">
<meta property="og:type" content="website">
<meta name="author" content="Lucas &amp; Liam Legacy Studios">
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000; overflow: hidden;
    overscroll-behavior: none; touch-action: none;
  }
  #sky { display: block; width: 100vw; height: 100vh; height: 100dvh; }
  #curtain {
    position: fixed; inset: 0; background: #000;
    pointer-events: none; opacity: 1;
    transition: opacity 2400ms ease-out;
  }
  #curtain.lift { opacity: 0; }
  /* Report UI. The sky is the product; everything here stays dark and small. */
  #reportBar {
    position: fixed; left: 50%;
    bottom: calc(18px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    z-index: 5;
  }
  #community {
    appearance: none; -webkit-appearance: none;
    padding: 7px 28px 7px 13px; border-radius: 999px;
    background: rgba(8, 12, 22, 0.45)
      url("data:image/svg+xml;utf8,<svg%20xmlns='http://www.w3.org/2000/svg'%20width='10'%20height='6'><path%20d='M1%201l4%204%204-4'%20stroke='%238d97ad'%20stroke-width='1.5'%20fill='none'/></svg>")
      no-repeat right 11px center;
    border: 1px solid rgba(130, 150, 190, 0.20);
    color: #8d97ad;
    font: 400 12.5px/1 ui-sans-serif, -apple-system, system-ui, sans-serif;
    max-width: 250px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #community:focus-visible { outline: 2px solid rgba(150, 170, 210, 0.55); outline-offset: 2px; }
  #community option { background: #0e1420; color: #d8dfec; }
  #report {
    padding: 15px 32px; border-radius: 999px;
    background: rgba(10, 15, 26, 0.62);
    border: 1px solid rgba(140, 160, 200, 0.35);
    color: #d8dfec;
    font: 600 16.5px/1 ui-sans-serif, -apple-system, system-ui, sans-serif;
    letter-spacing: 0.01em;
    cursor: pointer; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px);
    transition: transform 120ms ease, background 120ms ease, opacity 200ms ease;
    touch-action: manipulation;
  }
  #report:active { transform: scale(0.95); background: rgba(14, 20, 34, 0.72); }
  #report:disabled { opacity: 0.55; cursor: default; }
  #report:focus-visible { outline: 2px solid rgba(150, 170, 210, 0.6); outline-offset: 3px; }
  #countChip {
    position: fixed; top: calc(12px + env(safe-area-inset-top)); right: 12px;
    padding: 8px 14px; border-radius: 999px;
    background: rgba(8, 12, 22, 0.5);
    border: 1px solid rgba(130, 150, 190, 0.22);
    color: #a9b3c8;
    font: 500 13px/1 ui-sans-serif, -apple-system, system-ui, sans-serif;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    z-index: 5; touch-action: manipulation;
  }
  #countChip b { color: #dbe2f0; font-weight: 600; }
  #countChip:focus-visible { outline: 2px solid rgba(150, 170, 210, 0.55); outline-offset: 2px; }
  #feed {
    position: fixed; top: calc(52px + env(safe-area-inset-top)); right: 12px;
    width: min(84vw, 292px); max-height: 52vh; overflow-y: auto;
    background: rgba(6, 10, 18, 0.74);
    border: 1px solid rgba(130, 150, 190, 0.20);
    border-radius: 14px; padding: 11px 13px;
    color: #97a1b6;
    font: 400 12.5px/1.5 ui-sans-serif, -apple-system, system-ui, sans-serif;
    opacity: 0; pointer-events: none; transform: translateY(-6px);
    transition: opacity 180ms ease, transform 180ms ease;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    z-index: 5;
  }
  #feed.open { opacity: 1; pointer-events: auto; transform: none; }
  #feed .head { font-weight: 600; font-size: 12px; color: #b7c1d6; letter-spacing: 0.03em; padding-bottom: 5px; }
  #feed .row { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-top: 1px solid rgba(130, 150, 190, 0.10); }
  #feed .tally { display: flex; align-items: center; gap: 9px; padding: 4.5px 0; }
  #feed .tally__name {
    flex: 0 0 92px; font-size: 11.5px; color: #97a1b6;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #feed .tally__bar {
    flex: 1 1 auto; height: 4px; border-radius: 2px;
    background: rgba(130, 150, 190, 0.13); overflow: hidden;
  }
  #feed .tally__bar i {
    display: block; height: 100%; border-radius: 2px;
    background: linear-gradient(90deg, rgba(150, 175, 225, 0.5), rgba(205, 220, 250, 0.8));
    transition: width 600ms ease;
  }
  #feed .tally__n {
    flex: 0 0 auto; min-width: 15px; text-align: right;
    font-size: 11.5px; font-weight: 600; color: #c2cbdd;
  }
  #feed .sub { padding-top: 9px; }
  #feed .note { padding-top: 8px; color: #6d7890; font-size: 11.5px; }
  #toast {
    position: fixed; top: calc(14px + env(safe-area-inset-top)); left: 50%;
    transform: translateX(-50%) translateY(-8px);
    padding: 9px 17px; border-radius: 999px;
    background: rgba(8, 12, 22, 0.68);
    border: 1px solid rgba(130, 150, 190, 0.24);
    color: #c4cde0;
    font: 500 13px/1 ui-sans-serif, -apple-system, system-ui, sans-serif;
    white-space: nowrap; opacity: 0; pointer-events: none;
    transition: opacity 350ms ease, transform 350ms ease;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    z-index: 6;
  }
  #toast.show { opacity: 1; transform: translateX(-50%); }
  #showerNote {
    font: 400 12px/1.4 ui-sans-serif, -apple-system, system-ui, sans-serif;
    color: #8f99ae; text-align: center;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    padding: 0 10px; max-width: 300px;
  }
  #showerNote:empty { display: none; }
  @keyframes reportPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(150, 170, 220, 0); border-color: rgba(140, 160, 200, 0.35); }
    50% { box-shadow: 0 0 18px 2px rgba(150, 170, 220, 0.28); border-color: rgba(172, 190, 228, 0.62); }
  }
  #report.pulse { animation: reportPulse 3s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { #report.pulse { animation: none; } }
  #soundBtn {
    position: fixed; left: 14px;
    bottom: calc(20px + env(safe-area-inset-bottom));
    width: 42px; height: 42px; border-radius: 50%;
    background: rgba(8, 12, 22, 0.5);
    border: 1px solid rgba(130, 150, 190, 0.22);
    color: #6f7a90; font-size: 16px; line-height: 40px; text-align: center;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    transition: color 200ms ease, border-color 200ms ease;
    z-index: 5; touch-action: manipulation; padding: 0;
  }
  #soundBtn.on { color: #d8dfec; border-color: rgba(160, 180, 220, 0.5); }
  #shareBtn {
    position: fixed; right: 14px;
    bottom: calc(20px + env(safe-area-inset-bottom));
    width: 42px; height: 42px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(8, 12, 22, 0.5);
    border: 1px solid rgba(130, 150, 190, 0.22);
    color: #6f7a90;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    transition: color 200ms ease, border-color 200ms ease, transform 120ms ease;
    z-index: 5; touch-action: manipulation; padding: 0;
  }
  #shareBtn:hover { color: #d8dfec; border-color: rgba(160, 180, 220, 0.5); }
  #shareBtn:active { transform: scale(0.93); }
  #shareBtn:focus-visible { outline: 2px solid rgba(150, 170, 210, 0.55); outline-offset: 2px; }
  #soundBtn:focus-visible { outline: 2px solid rgba(150, 170, 210, 0.55); outline-offset: 2px; }
  #intro {
    position: fixed; inset: 0; z-index: 8;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, 0.44);
    opacity: 0; pointer-events: none;
    transition: opacity 700ms ease;
  }
  #intro.show { opacity: 1; pointer-events: auto; }
  #intro .box {
    max-width: min(84vw, 330px); text-align: center;
    padding: 26px 26px 22px;
    background: rgba(8, 11, 18, 0.74);
    border: 1px solid rgba(130, 150, 190, 0.22);
    border-radius: 18px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  /* Studio credit. Top-left is the one corner nothing else occupies, and a
     watermark is the right weight for this — the sky is still the product. */
  #credit {
    position: fixed;
    top: calc(13px + env(safe-area-inset-top)); left: 14px;
    z-index: 5; text-decoration: none;
    opacity: 0; transition: opacity 1200ms ease;
    -webkit-tap-highlight-color: transparent;
  }
  #credit.show { opacity: 0.40; }
  #credit:hover, #credit:focus-visible { opacity: 0.85; }
  #credit span { display: block; text-shadow: 0 1px 5px rgba(0, 0, 0, 0.9); }
  #credit .studio {
    font: 400 12.5px/1.35 "Fraunces", Georgia, "Times New Roman", serif;
    color: #ddd3c3; letter-spacing: 0.03em;
  }
  #credit .place {
    font: 400 9.5px/1.35 ui-sans-serif, -apple-system, system-ui, sans-serif;
    color: #8b93a6; letter-spacing: 0.11em; text-transform: uppercase;
  }
  #intro p {
    margin: 0 0 18px;
    font: 400 15px/1.6 ui-sans-serif, -apple-system, system-ui, sans-serif;
    color: #c3cbdc;
  }
  #introGo {
    padding: 12px 26px; border-radius: 999px;
    background: rgba(16, 22, 36, 0.8);
    border: 1px solid rgba(150, 170, 210, 0.4);
    color: #dde3f0;
    font: 600 15px/1 ui-sans-serif, -apple-system, system-ui, sans-serif;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  #fallback {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center;
    padding: 2rem; text-align: center;
    font: 400 15px/1.6 ui-sans-serif, -apple-system, system-ui, sans-serif;
    color: #7b8497; background: #05070f;
  }
</style>

<body>
<canvas id="sky"></canvas>
<div id="curtain"></div>
<div id="reportBar">
  <div id="showerNote"></div>
  <select id="community" aria-label="Where are you watching from?">
    <option value="">Where are you watching from?</option>
  </select>
  <button id="report" type="button">I saw one ⭐</button>
</div>
<button id="countChip" type="button" aria-expanded="false" aria-controls="feed">✦ <b id="countN">0</b> tonight</button>
<div id="feed" role="log" aria-label="Recent sightings"></div>
<div id="toast" role="status" aria-live="polite"></div>
<a id="credit" href="https://lucasliamlegacy.com" target="_blank" rel="noopener noreferrer">
  <span class="studio">Lucas &amp; Liam Legacy Studios</span>
  <span class="place">St. Peter&rsquo;s, Cape Breton</span>
</a>
<button id="soundBtn" type="button" aria-pressed="false" aria-label="Turn on shore sound">&#9834;</button>
<button id="shareBtn" type="button" aria-label="Share this sky">
  <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M12 3.5v12"/><path d="M7.6 7.9 12 3.5l4.4 4.4"/><path d="M5 14.5V19a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4.5"/>
  </svg>
</button>
<div id="intro" role="dialog" aria-label="About this sky">
  <div class="box">
    <p>When someone under this sky sees a shooting star and taps the button, it flies for everyone watching. One sky, the whole Maritimes under it.</p>
    <button id="introGo" type="button">Look up &#11088;</button>
  </div>
</div>
<div id="fallback">This scene needs WebGL. Try a different browser, or turn on hardware acceleration.</div>
