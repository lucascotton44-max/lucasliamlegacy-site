<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 120 120">
  <!-- One Sky mark: the four-point star the page already uses (the ✦ in the
       count chip), given a meteor's trail. Concave sparkle, classic form. -->
  <defs>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbe2f0" stop-opacity="0"/>
      <stop offset="1" stop-color="#dbe2f0" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <line x1="-52" y1="-52" x2="-13" y2="-13" stroke="url(#trail)" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M 0,-34 C 5,-10 10,-5 34,0 C 10,5 5,10 0,34 C -5,10 -10,5 -34,0 C -10,-5 -5,-10 0,-34 Z"
        fill="#e8edf6"/>
</svg>
